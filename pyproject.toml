[project]
name = "fly-doom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-Quartz>=11.1",
    "pyobjc-framework-Cocoa>=11.1",
    "Pillow>=11.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
